<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, 'Segoe UI', sans-serif">
  <text x="160" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#ece7dd">8× RTX 4090</text>
  <g fill="#181c26" stroke="#00e5ff" stroke-width="2">
    <rect x="44" y="52" width="52" height="32" rx="6"/>
    <rect x="108" y="52" width="52" height="32" rx="6"/>
    <rect x="172" y="52" width="52" height="32" rx="6"/>
    <rect x="236" y="52" width="52" height="32" rx="6"/>
    <rect x="44" y="92" width="52" height="32" rx="6"/>
    <rect x="108" y="92" width="52" height="32" rx="6"/>
    <rect x="172" y="92" width="52" height="32" rx="6"/>
    <rect x="236" y="92" width="52" height="32" rx="6"/>
  </g>
  <text x="480" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#ece7dd">1× H100</text>
  <rect x="410" y="52" width="140" height="72" rx="10" fill="#181c26" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#ece7dd">H100 80GB</text>
  <line x1="322" y1="20" x2="322" y2="310" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- bars, baseline 280 -->
  <rect x="76" y="186" width="56" height="94" rx="6" fill="rgba(232,182,76,0.25)" stroke="#e8b64c" stroke-width="2"/>
  <text x="104" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#e8b64c">7,200/hr</text>
  <rect x="172" y="252" width="56" height="28" rx="6" fill="rgba(0,229,255,0.2)" stroke="#00e5ff" stroke-width="2"/>
  <text x="200" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#ece7dd">$</text>
  <text x="104" y="298" text-anchor="middle" font-size="11" fill="#8b8fa3">output</text>
  <text x="200" y="298" text-anchor="middle" font-size="11" fill="#8b8fa3">cost</text>
  <rect x="420" y="190" width="56" height="90" rx="6" fill="rgba(232,182,76,0.25)" stroke="#e8b64c" stroke-width="2"/>
  <text x="448" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#e8b64c">≈ same</text>
  <rect x="516" y="156" width="56" height="124" rx="6" fill="rgba(255,107,107,0.18)" stroke="#ff6b6b" stroke-width="2"/>
  <text x="544" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#ff6b6b">$$$</text>
  <text x="448" y="298" text-anchor="middle" font-size="11" fill="#8b8fa3">output</text>
  <text x="544" y="298" text-anchor="middle" font-size="11" fill="#8b8fa3">cost</text>
  <text x="320" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#e8b64c">same output, a fraction of the cost — batch scales out</text>
