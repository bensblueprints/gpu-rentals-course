  <text x="60" y="262" font-size="15" font-weight="700" fill="#ece7dd">4-bit AWQ</text>
  <rect x="60" y="272" width="169" height="52" rx="10" fill="rgba(232,182,76,0.18)" stroke="#e8b64c" stroke-width="2"/>
