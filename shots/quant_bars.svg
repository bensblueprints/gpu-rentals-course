  <circle cx="255" cy="298" r="11" fill="none" stroke="#6bffa3" stroke-width="2"/>
  <polyline points="249,298 253,303 261,293" fill="none" stroke="#6bffa3" stroke-width="2.5"/>
  <text x="465" y="350" text-anchor="middle" font-size="12" fill="#8b8fa3">4-bit is the serving sweet spot — fits with room for KV cache</text>
