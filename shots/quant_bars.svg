<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, 'Segoe UI', sans-serif">
  <text x="60" y="32" font-size="11" font-weight="700" letter-spacing="2" fill="#8b8fa3">ONE 14B MODEL, THREE PRECISIONS</text>
  <text x="465" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#ece7dd">24GB card</text>
  <line x1="465" y1="52" x2="465" y2="330" stroke="#ece7dd" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="60" y="62" font-size="15" font-weight="700" fill="#ece7dd">FP16</text>
  <rect x="60" y="72" width="472" height="52" rx="10" fill="rgba(255,107,107,0.18)" stroke="#ff6b6b" stroke-width="2"/>
  <text x="522" y="105" text-anchor="end" font-size="14" font-weight="700" fill="#ff6b6b">~28GB — over</text>
  <text x="60" y="162" font-size="15" font-weight="700" fill="#ece7dd">INT8</text>
  <rect x="60" y="172" width="236" height="52" rx="10" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="2"/>
