  <text x="246" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ece7dd">GPU</text>
  <line x1="106" y1="98" x2="190" y2="112" stroke="#00e5ff" stroke-width="2" marker-end="url(#mC)"/>
  <line x1="106" y1="138" x2="190" y2="130" stroke="#8b8fa3" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mM)"/>
  <line x1="106" y1="178" x2="190" y2="146" stroke="#8b8fa3" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mM)"/>
  <rect x="40" y="230" width="264" height="32" rx="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="44" y="234" width="52" height="24" rx="3" fill="rgba(232,182,76,0.35)"/>
  <rect x="150" y="234" width="36" height="24" rx="3" fill="rgba(232,182,76,0.35)"/>
  <rect x="252" y="234" width="30" height="24" rx="3" fill="rgba(232,182,76,0.35)"/>
