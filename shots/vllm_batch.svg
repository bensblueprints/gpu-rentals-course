  <rect x="540" y="234" width="40" height="24" rx="3" fill="rgba(232,182,76,0.35)"/>
  <rect x="584" y="234" width="36" height="24" rx="3" fill="rgba(0,229,255,0.3)"/>
  <text x="492" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#e8b64c">one 3090 serves 20-40 users</text>
</svg>
