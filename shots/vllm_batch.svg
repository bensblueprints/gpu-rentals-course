    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8b64c"/></marker>
    <marker id="mM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b8fa3"/></marker>
  </defs>
  <line x1="322" y1="20" x2="322" y2="330" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- LEFT: without batching -->
  <text x="165" y="34" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#8b8fa3">WITHOUT BATCHING</text>
  <text x="150" y="66" text-anchor="middle" font-size="11" fill="#8b8fa3">requests arrive one at a time</text>
