  <text x="392" y="206" text-anchor="middle" font-size="11" fill="#8b8fa3">20-40 requests at once</text>
  <rect x="464" y="96" width="110" height="52" rx="10" fill="#181c26" stroke="#e8b64c" stroke-width="2"/>
